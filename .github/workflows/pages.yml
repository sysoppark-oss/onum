name: PC용 웹 앱 올리기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: '노래방 AI(PC) - 모델과 계산기(onnxruntime-web) 넣기'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh tools/ai/fetch-model.sh dist/models/htdemucs.onnx
          cp tools/ai/model.json dist/models/model.json
          mkdir -p dist/ort
          cp node_modules/onnxruntime-web/dist/ort.min.js node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.* dist/ort/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  # 올린 꾸러미가 GitHub에 등록될 틈을 주려고 펼치기는 따로 한다(한 작업에서 바로 펼치면 「꾸러미를 못 찾음」으로 실패하곤 했다)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
