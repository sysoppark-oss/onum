name: 안드로이드 시험판 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

# 기본은 읽기만. 올리는 작업(publish)만 쓰기 권한을 갖는다.
# 외부 도구(actions)는 모두 커밋 지문으로 고정한다: 이름표(@v4)는 남이 바꿔 달 수 있다.
permissions:
  contents: read

jobs:
  # 만들기: 서명 열쇠를 쓰지만 저장소에는 쓸 수 없다
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: 웹 화면 만들기
        run: |
          npm ci
          echo "VITE_NATIVE=$(sh tools/native-hash.sh)" >> $GITHUB_ENV
          echo "VITE_SHA=${GITHUB_SHA::12}" >> $GITHUB_ENV
          echo "VITE_RUN=${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          echo "VITE_BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: 업데이트 확인용 공개 키 꺼내기(시험판 열쇠의 공개 부분. 비밀 값은 남기지 않는다)
        env:
          KEYSTORE_B64: ${{ secrets.ONUM_TEST_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ONUM_TEST_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::시험판 열쇠(ONUM_TEST_*)가 Secrets에 없어요. RECOVERY.md를 보세요."; exit 1
          fi
          P12="$RUNNER_TEMP/pub.p12"; CERT="$RUNNER_TEMP/cert.der"
          trap 'rm -f "$P12"' EXIT
          echo "$KEYSTORE_B64" | base64 -d > "$P12"
          openssl pkcs12 -in "$P12" -passin env:KS_PASS -nokeys -clcerts 2>/dev/null | openssl x509 -outform DER > "$CERT"
          # 앱 서명과 같은 비공개 열쇠(지문 dd97eb03)인지 확인한다
          [ "$(sha256sum "$CERT" | cut -c1-8)" = "dd97eb03" ] || { echo "::error::시험판 열쇠 지문이 dd97eb03이 아니에요"; exit 1; }
          openssl x509 -inform DER -in "$CERT" -noout -text | grep -q "rsaEncryption" || { echo "::error::시험판 열쇠가 RSA가 아니에요(업데이트 서명 방식을 맞춰야 해요)"; exit 1; }
          openssl x509 -inform DER -in "$CERT" -pubkey -noout > "$RUNNER_TEMP/upd-pub.pem"
          echo "VITE_UPD_PUB=$(openssl pkey -pubin -in "$RUNNER_TEMP/upd-pub.pem" -outform DER | base64 -w0)" >> $GITHUB_ENV

      - name: 화면 부분 꾸러미(자동 업데이트용)
        run: |
          npm run build
          (cd dist && zip -qr ../web.zip .)
          echo "WEB_SUM=$(sha256sum web.zip | cut -d' ' -f1)" >> $GITHUB_ENV
          npx cap sync android

      - name: 노래방 AI 모델 넣기(지문 확인)
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tools/ai/fetch-model.sh android/app/src/main/assets/models/htdemucs.onnx

      # 비밀번호는 이 단계 안에서만 쓴다(다음 단계의 환경 변수에 남기지 않는다). 열쇠 파일은 단계가 끝나면 지운다.
      - name: APK 만들기와 업데이트 안내 서명(값은 찍지 않는다)
        env:
          KEYSTORE_B64: ${{ secrets.ONUM_TEST_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ONUM_TEST_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ONUM_TEST_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ONUM_TEST_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::시험판 열쇠(ONUM_TEST_*)가 Secrets에 없어요. RECOVERY.md를 보세요."; exit 1
          fi
          P12="$RUNNER_TEMP/onum-test.p12"; KEY="$RUNNER_TEMP/onum-test.key"
          trap 'rm -f "$P12" "$KEY"' EXIT
          echo "$KEYSTORE_B64" | base64 -d > "$P12"
          export ONUM_TEST_KEYSTORE="$P12" ONUM_TEST_KEYSTORE_PASSWORD="$KS_PASS" ONUM_TEST_KEY_ALIAS="$KEY_ALIAS" ONUM_TEST_KEY_PASSWORD="$KEY_PASS"
          chmod +x android/gradlew
          (cd android && ./gradlew assembleDebug --no-daemon)
          cp android/app/build/outputs/apk/debug/app-debug.apk onum-test.apk
          # 시험판은 org.onum.player.test여야 한다(스토어 판 자리를 시험 열쇠로 덮을 수 없게)
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          $AAPT dump badging onum-test.apk | grep -E "^package|application-label:" || true
          unzip -l onum-test.apk | grep -q "assets/models/htdemucs.onnx" || { echo "::error::노래방 AI 모델이 APK에 없어요"; exit 1; }
          $AAPT dump badging onum-test.apk | grep -q "^package: name='org.onum.player.test' " || { echo "::error::시험판 패키지 이름이 org.onum.player.test가 아니에요"; exit 1; }
          SIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $SIGNER verify --print-certs onum-test.apk | grep -E "SHA-256" || true
          # 새 비공개 열쇠(지문 dd97eb03)로 서명됐는지 확인한다
          $SIGNER verify --print-certs onum-test.apk | grep -q "SHA-256 digest: dd97eb03" || { echo "::error::시험판이 비공개 시험 열쇠로 서명되지 않았어요"; exit 1; }
          # 업데이트 안내에 서명한다: 앱은 이 서명이 맞을 때만 화면 꾸러미(web.zip)를 받아 들인다.
          # 서명하는 글은 src/lib/update.ts의 것과 글자 하나까지 같아야 한다.
          openssl pkcs12 -in "$P12" -passin env:KS_PASS -nocerts -noenc -out "$KEY" 2>/dev/null
          printf 'onum-update-v1\n%s\n%s\n%s\n%s' "$VITE_SHA" "$VITE_NATIVE" "$GITHUB_RUN_NUMBER" "$WEB_SUM" > upd.msg
          openssl dgst -sha256 -sign "$KEY" -out upd.sig upd.msg
          openssl dgst -sha256 -verify "$RUNNER_TEMP/upd-pub.pem" -signature upd.sig upd.msg
          jq -nc --arg sha "$VITE_SHA" --arg native "$VITE_NATIVE" --argjson run "$GITHUB_RUN_NUMBER" --arg at "$VITE_BUILT_AT" --arg sum "$WEB_SUM" --arg sig "$(base64 -w0 upd.sig)" \
            '{sha:$sha,native:$native,run:$run,at:$at,sum:$sum,sig:$sig}' > update.json
          rm -f upd.msg upd.sig

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: onum-test-${{ github.run_number }}
          path: |
            onum-test.apk
            web.zip
            update.json

  # 올리기: 저장소(릴리스)에 쓸 수 있지만 서명 열쇠는 받지 않는다. 외부 도구 없이 GitHub 공식 명령(gh)만 쓴다.
  publish:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: onum-test-${{ github.run_number }}

      - name: 휴대폰에서 받을 수 있게 올리기
        run: |
          # 내려받은 횟수: APK를 바꿔 올리면 GitHub의 수가 0이 되므로 앞의 수를 더해 둔다
          rel=$(gh api "repos/$GH_REPO/releases/tags/test-build" 2>/dev/null || echo '{}')
          now=$(echo "$rel" | jq '[.assets[]? | select(.name=="onum-test.apk") | .download_count] | add // 0')
          base=$(echo "$rel" | jq -r '.body // ""' | sed -n 's/.*<!--onum \(.*\)-->.*/\1/p' | jq '.dl // 0' 2>/dev/null || echo 0)
          info=$(jq -c --argjson dl "$(( ${base:-0} + ${now:-0} ))" '. + {dl:$dl}' update.json)
          cat > body.md <<EOF
          시험판 ${{ github.run_number }}번 · ${{ github.sha }}
          휴대폰에서 onum-test.apk를 눌러 내려받아 설치하세요.
          · 시험판은 「온음 시험판」(org.onum.player.test)이에요. 스토어 판 「온음」(org.onum.player)과 따로 깔려요.
          · 이 공식 페이지(github.com/sysoppark-oss/onum)에서 받은 것만 설치하세요.
          · 2026-11-25에 시험판 서명 열쇠를 비공개로 바꿨어요. 그 전에 깐 「온음 시험판」은 업데이트가 안 되니, 지우고 이 판을 다시 깔아 주세요.
          · 옛 시험판(2026-11-24 전, 이름이 그냥 「온음」)을 쓰셨다면 그 앱을 지우고 이 시험판이나 스토어 판을 깔아 주세요. 목록·설정은 넘어오지 않아요.
          <!--onum $info-->
          EOF
          sed -i 's/^          //' body.md
          gh release view test-build >/dev/null 2>&1 || gh release create test-build --title "온음 시험판 (최신)" --notes "준비 중" --prerelease --latest=false
          gh release upload test-build onum-test.apk web.zip --clobber
          gh release edit test-build --title "온음 시험판 (최신)" --notes-file body.md --prerelease --latest=false
