name: PC용 웹 앱 올리기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # ONUM_CSP: PC 웹 앱에만 CSP(우리 스크립트만 실행)를 넣는다
      - run: npm ci && npm run build
        env:
          ONUM_CSP: '1'
      - name: '노래방 AI(PC) - 모델과 계산기(onnxruntime-web) 넣기'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh tools/ai/fetch-model.sh dist/models/htdemucs.onnx
          cp tools/ai/model.json dist/models/model.json
          mkdir -p dist/ort
          cp node_modules/onnxruntime-web/dist/ort.min.js node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.* dist/ort/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist
  # 올린 꾸러미가 GitHub에 등록될 틈을 주려고 펼치기는 따로 한다(한 작업에서 바로 펼치면 「꾸러미를 못 찾음」으로 실패하곤 했다)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
