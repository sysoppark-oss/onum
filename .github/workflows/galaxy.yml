name: 스토어 정식 판 만들기

# 손으로만 실행한다(Actions › 스토어 정식 판 만들기 › Run workflow).
# 만든 파일은 공개 릴리스에 올리지 않고, 이 실행 기록 아래 「Artifacts」에만 둔다.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '판 이름 (스토어에 보이는 번호, 예: 2.0.0)'
        required: true
        default: '2.0.0'
      store:
        description: '올릴 스토어 (onestore 또는 galaxy)'
        required: true
        default: 'onestore'
        type: choice
        options: [onestore, galaxy]

permissions:
  contents: read

jobs:
  galaxy:
    runs-on: ubuntu-latest
    env:
      ONUM_VERSION_NAME: ${{ inputs.version_name }}
      VITE_STORE: ${{ inputs.store }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: '화면 만들기(스토어 판 - 앱 안 새 판 받기 끔, 받는 곳 주소)'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 판 번호: 시험판 번호보다 늘 크게, 실행할 때마다 하나씩 올라간다(스토어는 번호가 올라가야 업데이트로 받는다)
          echo "ONUM_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> $GITHUB_ENV
          npm ci
          echo "VITE_NATIVE=$(sh tools/native-hash.sh)" >> $GITHUB_ENV
          npm run build
          npx cap sync android
          sh tools/ai/fetch-model.sh android/app/src/main/assets/models/htdemucs.onnx

      # 비밀번호는 이 단계 안에서만 쓴다(다음 단계의 환경 변수에 남기지 않는다). 열쇠 파일은 단계가 끝나면 지운다.
      - name: APK·AAB 만들기(정식 서명 열쇠는 이 단계에서만)
        env:
          KEYSTORE_B64: ${{ secrets.ONUM_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ONUM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ONUM_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ONUM_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/onum-release.keystore"
          trap 'rm -f "$KS"' EXIT
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::정식 서명 열쇠(ONUM_KEYSTORE_B64)가 없어 서명하지 않은 점검용 파일만 만듭니다. 스토어에는 올릴 수 없어요."
          else
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            export ONUM_KEYSTORE="$KS" ONUM_KEYSTORE_PASSWORD="$KS_PASS" ONUM_KEY_ALIAS="$KEY_ALIAS" ONUM_KEY_PASSWORD="$KEY_PASS"
          fi
          chmod +x android/gradlew
          (cd android && ./gradlew assembleRelease bundleRelease --no-daemon)
          mkdir -p out
          if [ -n "$ONUM_KEYSTORE" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/onum-${VITE_STORE}-${ONUM_VERSION_NAME}.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab "out/onum-${VITE_STORE}-${ONUM_VERSION_NAME}.aab"
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "out/onum-${ONUM_VERSION_NAME}-unsigned-check-only.apk"
          fi

      - name: 디버깅이 꺼져 있는지 확인
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          f=$(ls out/*.apk | head -1)
          $AAPT dump badging "$f" | grep -E "^package|application-debuggable" || true
          if $AAPT dump badging "$f" | grep -q "application-debuggable"; then echo "::error::디버깅이 켜져 있어요"; exit 1; fi
          # 스토어 판 패키지 이름은 절대 바뀌면 안 된다
          $AAPT dump badging "$f" | grep -q "^package: name='org.onum.player' " || { echo "::error::스토어 판 패키지 이름이 org.onum.player가 아니에요"; exit 1; }
          # 어떤 열쇠로 서명됐는지(공개해도 되는 지문) 기록에 남긴다
          SIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $SIGNER verify --print-certs "$f" | grep -E "SHA-256|DN" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: onum-${{ inputs.store }}-${{ inputs.version_name }}-${{ github.run_number }}
          path: out/
          retention-days: 30
