name: 안드로이드 시험판 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 웹 화면 만들기
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: APK 만들기
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../onum-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: onum-test-${{ github.run_number }}
          path: onum-test.apk

      - name: 휴대폰에서 받을 수 있게 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: 온음 시험판 (최신)
          prerelease: true
          make_latest: false
          body: |
            시험판 ${{ github.run_number }}번 · ${{ github.sha }}
            휴대폰에서 onum-test.apk를 눌러 내려받아 설치하세요.
          files: onum-test.apk
