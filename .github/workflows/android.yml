name: 안드로이드 시험판 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 웹 화면 만들기
        run: |
          npm ci
          echo "VITE_NATIVE=$(sh tools/native-hash.sh)" >> $GITHUB_ENV
          echo "VITE_SHA=${GITHUB_SHA::12}" >> $GITHUB_ENV
          echo "VITE_RUN=${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          echo "VITE_BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: 화면 부분 꾸러미(자동 업데이트용)
        run: |
          npm run build
          (cd dist && zip -qr ../web.zip .)
          npx cap sync android

      - name: APK 만들기
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../onum-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: onum-test-${{ github.run_number }}
          path: onum-test.apk

      - name: 내려받은 횟수 모으기(APK를 바꿔 올리면 GitHub의 수가 0이 되므로 앞의 수를 더해 둔다)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rel=$(gh api repos/${{ github.repository }}/releases/tags/test-build 2>/dev/null || echo '{}')
          now=$(echo "$rel" | jq '[.assets[]? | select(.name=="onum-test.apk") | .download_count] | add // 0')
          base=$(echo "$rel" | jq -r '.body // ""' | sed -n 's/.*<!--onum \(.*\)-->.*/\1/p' | jq '.dl // 0' 2>/dev/null || echo 0)
          echo "DL_TOTAL=$(( ${base:-0} + ${now:-0} ))" >> $GITHUB_ENV

      - name: 휴대폰에서 받을 수 있게 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: 온음 시험판 (최신)
          prerelease: true
          make_latest: false
          body: |
            시험판 ${{ github.run_number }}번 · ${{ github.sha }}
            휴대폰에서 onum-test.apk를 눌러 내려받아 설치하세요.
            <!--onum {"sha":"${{ env.VITE_SHA }}","native":"${{ env.VITE_NATIVE }}","run":${{ github.run_number }},"at":"${{ env.VITE_BUILT_AT }}","dl":${{ env.DL_TOTAL }}}-->
          files: |
            onum-test.apk
            web.zip
