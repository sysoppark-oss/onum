apply plugin: 'com.android.application'

android {
    namespace = "org.onum.player"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.onum.player"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // GitHub에서 만들 때마다 번호가 올라가 기존 앱 위에 덮어 설치된다
        // 정식 판(스토어)은 ONUM_VERSION_CODE·ONUM_VERSION_NAME으로 번호를 정한다
        versionCode((System.getenv("ONUM_VERSION_CODE") ?: System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName(System.getenv("ONUM_VERSION_NAME") ?: ("1.0.0-test." + (System.getenv("GITHUB_RUN_NUMBER") ?: "local")))
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // 노래방 AI(ONNX Runtime)의 기계어 부분: 휴대폰(arm)과 에뮬레이터(x86_64)만
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // 노래방 AI 모델은 압축하지 않고 넣는다(크기를 그대로 읽어 한 번만 꺼내 둔다)
    androidResources { noCompress += ['onnx'] }
    signingConfigs {
        // 시험판 열쇠: 저장소에 두지 않는다(2026-11-25부터 비공개). GitHub Secrets(ONUM_TEST_*)에서 꺼내 파일로 만든 뒤 넘긴다.
        // 없으면(내 PC에서 만들 때) 안드로이드 기본 디버그 열쇠로 서명된다.
        if (System.getenv("ONUM_TEST_KEYSTORE")) {
            test {
                storeFile file(System.getenv("ONUM_TEST_KEYSTORE"))
                storePassword System.getenv("ONUM_TEST_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ONUM_TEST_KEY_ALIAS")
                keyPassword System.getenv("ONUM_TEST_KEY_PASSWORD")
            }
        }
        // 정식 판 열쇠: 저장소에 두지 않는다. GitHub Secrets에서 꺼내 파일로 만든 뒤 경로와 비밀번호를 넘긴다.
        if (System.getenv("ONUM_KEYSTORE")) {
            release {
                storeFile file(System.getenv("ONUM_KEYSTORE"))
                storePassword System.getenv("ONUM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ONUM_KEY_ALIAS")
                keyPassword System.getenv("ONUM_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            // 시험판은 스토어 판(org.onum.player)과 다른 앱으로: org.onum.player.test, 이름 「온음 시험판」(src/debug/res)
            // 스토어 판 자리를 시험 열쇠로 덮어쓸 수 없게 한다
            applicationIdSuffix ".test"
            if (System.getenv("ONUM_TEST_KEYSTORE")) signingConfig signingConfigs.test
            // 사람들에게 나눠 주는 판이므로 디버그로 열어 두지 않는다
            debuggable false
        }
        release {
            if (System.getenv("ONUM_KEYSTORE")) signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // 노래방 AI 목소리 분리(기기 안에서만 계산)
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
